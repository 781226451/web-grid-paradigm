# BCI Web-Grid — example session configuration.
#
# Run with:  uv run webgrid --config configs/default.toml
# Any command-line flag overrides the matching key here.

subject = "sub-01"
session = ""                # empty -> local timestamp (YYYYMMDD-HHMMSS)
output_dir = "data"
language = "zh"             # zh | en
font = "Microsoft YaHei"

# --- grid and task ---------------------------------------------------------
rows = 12
cols = 12
targets = 40                # targets presented in this block
max_seconds = 300.0         # safety limit; 0 disables
selection = "click"         # click | dwell
dwell_time = 1.0            # seconds, used when selection = "dwell"
trial_timeout = 15.0        # per-target timeout; 0 disables
click_types = 1             # 1..3; target colour / required button, and score
feedback = 0.35             # hit/timeout feedback interval in seconds
countdown_seconds = 2.0
seed = 20261107

# --- input -----------------------------------------------------------------
input = "mouse"             # mouse | keyboard | udp | demo
udp_host = "127.0.0.1"
udp_port = 9000
smoothing = 0.0             # 0 raw ... 0.95 very smooth (UDP cursor only)
keyboard_step = 0.035       # normalised units per arrow-key event
demo_speed = 2.2            # normalised units per second

# --- display ---------------------------------------------------------------
fullscreen = true
window_width = 1280
window_height = 800
screen = 0
hide_cursor = true
skip_instructions = true       # animal use: no text/instruction screen by default
auto_exit = false

# --- event markers ---------------------------------------------------------
marker_udp = ""             # e.g. "127.0.0.1:9001"; empty disables
lsl = false                 # requires: uv sync --extra lsl
lsl_stream = "WebGridMarkers"
