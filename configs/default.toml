# BCI Web-Grid — example session configuration.
#
# Run with:  uv run webgrid --config configs/default.toml
# Any command-line flag overrides the matching key here.

subject = "sub-01"
session = ""                # empty -> local timestamp (YYYYMMDD-HHMMSS)
output_dir = "data"
language = "zh"             # zh | en
font = "Microsoft YaHei"

# --- grid and task ---------------------------------------------------------
rows = 12
cols = 12
blocks = 1                  # number of blocks
targets = 40                # trials (targets) per block
block_rest = 10.0           # blank rest between blocks, seconds
max_seconds = 300.0         # per-block safety limit; 0 disables
selection = "click"         # click | dwell
dwell_time = 1.0            # seconds, used when selection = "dwell"
trial_timeout = 15.0        # per-target timeout; 0 disables
click_types = 1             # 1..3; target colour / required button, and score
feedback = 0.35             # hit/timeout feedback interval in seconds
iti = 0.0                   # inter-trial rest after feedback (empty grid); 0 = none
countdown_seconds = 2.0
seed = 20261107

# --- input -----------------------------------------------------------------
input = "mouse"             # mouse | keyboard | udp | demo
udp_host = "127.0.0.1"
udp_port = 9000
smoothing = 0.0             # 0 raw ... 0.95 very smooth (UDP cursor only)
keyboard_step = 0.035       # normalised units per arrow-key event
demo_speed = 2.2            # normalised units per second

# --- display ---------------------------------------------------------------
fullscreen = true
window_width = 1280
window_height = 800
screen = 0
hide_cursor = true
skip_instructions = true       # animal use: no text/instruction screen by default
auto_exit = false

# --- event markers ---------------------------------------------------------
marker_udp = ""             # e.g. "127.0.0.1:9001"; empty disables
lsl = false
lsl_stream = "WebGridMarkers"

# LSL state stream: started from the web panel (or automatically with --lsl-state)
lsl_state = false           # true = publish the state stream as soon as the panel starts
lsl_state_stream = "WebGridState"
lsl_state_rate = 10.0       # snapshots per second

# --- reward ---------------------------------------------------------------
reward = "serial"           # delivery: serial | test | off
reward_policy = "per_hit"   # schedule: per_hit | ratio | none
reward_ratio = 2            # N for the "ratio" policy (every N-th hit)
reward_port = "COM3"        # Arduino serial port
reward_baud = 9600
reward_amount = 1           # reward units per payout (0 = no reward)
reward_duration_ms = 50     # pulse length passed to the Arduino

# --- web control panel -----------------------------------------------------
dashboard = true            # start the web panel (parameters + start + live view)
dashboard_host = "127.0.0.1"  # "0.0.0.0" lets other computers on the LAN connect
dashboard_port = 8765       # 0 = pick any free port (see the log for the URL)
dashboard_open = true       # open the browser automatically
