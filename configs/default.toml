# BCI Web-Grid — example session configuration (experiment + startup).
#
# This file is flat: every key is an ExperimentConfig field.
# Device settings (serial ports, LSL streams, reward hardware) belong in
# --device-config files such as configs/velocity_input.toml and
# configs/reward.toml.
#
# Run with:
#   uv run webgrid --config configs/default.toml

subject = "sub-01"
session = ""                 # empty -> local timestamp (YYYYMMDD-HHMMSS)
output_dir = "data"
language = "zh"              # zh | en
font = "Microsoft YaHei"
theme = "dark"               # dark = 暗色发光 | classic = 经典白底

# --- grid and task ----------------------------------------------------
rows = 12
cols = 12
blocks = 1                   # number of blocks
targets = 40                 # trials (targets) per block
block_rest = 10.0            # blank rest between blocks, seconds
max_seconds = 300.0          # per-block limit; 0 disables
selection = "click"          # click | dwell
dwell_time = 1.0             # used when selection = "dwell"
trial_timeout = 15.0         # per-target timeout; 0 disables
click_types = 1              # 1..3
feedback = 0.35              # feedback interval, seconds
iti = 0.0                    # inter-trial rest; 0 = none
countdown_seconds = 2.0
seed = 20261107

# --- input ------------------------------------------------------------
input = "mouse"              # mouse | demo | joystick | lsl

# --- display ----------------------------------------------------------
fullscreen = true
window_width = 1280
window_height = 800
screen = 0
hide_cursor = true
skip_instructions = true     # animal use: no instruction screen
auto_exit = false

# --- web control panel (bootstrap) ------------------------------------
dashboard = true
dashboard_host = "127.0.0.1"  # "0.0.0.0" lets other computers connect
dashboard_port = 8765         # 0 = pick any free port
dashboard_open = true
