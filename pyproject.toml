[project]
name = "web-grid-paradigm"
version = "0.1.0"
description = "PsychoPy implementation of a BCI web-grid target-selection paradigm"
readme = "README.md"
authors = [
    { name = "songle", email = "songle0389@lglab.ac.cn" }
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "loguru>=0.7",
    "psychopy>=2026.2.5",
    "pylsl>=1.16",
    "pyserial>=3.5",
]

[project.scripts]
webgrid = "web_grid_paradigm.app.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "pillow>=10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true